# A release of the Python packages: haus-fmt (python/) and the schema packages
# haus-fmt-money, -geo and -uuid (extensions/*/python/). A push to main that
# changes a pyproject.toml publishes every package whose version isn't on PyPI
# yet: bumping a version in a PR is the decision to release. The schema
# packages have the version of their npm package, which the npm release PR
# sets (typescript/scripts/sync-versions.mts).
#
# Trusted publishing: PyPI takes this workflow's OIDC token, so no token is
# stored, and the upload carries attestations. Each project lists this
# repository, this file and the environment pypi as its trusted publisher (on
# pypi.org, the project's Publishing settings; for a project that doesn't
# exist yet, a pending publisher). See PUBLISHING.md.
name: Python release

on:
  push:
    branches: [main]
    paths:
      - "python/pyproject.toml"
      - "extensions/*/python/pyproject.toml"
      - ".github/workflows/python-release.yml"
  # A re-run, e.g. to finish a partial release: published versions are skipped.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-release
  cancel-in-progress: false

env:
  # The published projects, each a folder with its pyproject.toml.
  PROJECTS: "python extensions/money/python extensions/geo/python extensions/uuid/python"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.build.outputs.new }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Test and build the new versions
        id: build
        run: |
          new=""
          for dir in $PROJECTS; do
            read -r name version < <(python3 -c 'import tomllib,sys; p=tomllib.load(open(sys.argv[1],"rb"))["project"]; print(p["name"], p["version"])' "$dir/pyproject.toml")
            status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$name/$version/json")
            case "$status" in
              200) echo "$name $version: on PyPI already"; continue ;;
              404) echo "$name $version: new" ;;
              *) echo "$name $version: PyPI answered $status"; exit 1 ;;
            esac
            (cd "$dir" && uv run pytest -q && uv build --out-dir "$GITHUB_WORKSPACE/dist")
            new="$new $name"
          done
          echo "new=${new# }" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.new != ''
        with:
          name: dist
          path: dist/

  # Publishing gets its own job, with only the OIDC permission and the built
  # files: nothing from the build runs where the token can be had.
  publish:
    needs: build
    if: needs.build.outputs.new != ''
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
