# Tests for every binding, the Lean proofs, and differential fuzzing.
#
# Pull requests and pushes to main run everything with a modest fuzzing
# budget; the nightly run fuzzes much longer. A fuzzing failure prints its
# seed: `node fuzz/src/main.ts --seed S` (or fuzz/src/time.ts) repeats it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Roc compiler is pre-release: pin the nightly the code is written for.
  ROC_NIGHTLY: nightly-2026-11-03-34bd006
  NODE_VERSION: "26"
  PNPM_VERSION: "12.4.1"

jobs:
  lean:
    name: Lean proofs and reference parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: spec/lean
          auto-config: false
          build: true
          # A warning fails the build, so a proof left as `sorry` can't slip in.
          build-args: "--wfail"
      - name: Conformance suite
        working-directory: spec/lean
        run: .lake/build/bin/haus-ref --suite ../../test-suite
      - name: Schema suite
        working-directory: spec/lean
        run: .lake/build/bin/haus-ref --schema-suite ../../test-suite/schema schema-suite.json
      - name: JSON suite
        working-directory: spec/lean
        run: .lake/build/bin/haus-ref --json-suite ../../test-suite/json json-suite.json

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        working-directory: rust
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        working-directory: rust
        run: cargo test --workspace --all-features

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Install
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: typescript
        run: pnpm typecheck
      - name: Test
        working-directory: typescript
        run: pnpm test
      - name: Effect lint (@effect/tsgo)
        working-directory: typescript/packages/effect
        run: pnpm lint
      - name: Lean schema types are up to date
        run: |
          node spec/lean/scripts/schema-types.ts > spec/lean/schema-suite.json
          node spec/lean/scripts/schema-types.ts test-suite/json > spec/lean/json-suite.json
          git diff --exit-code spec/lean/schema-suite.json spec/lean/json-suite.json
      - name: The skill's cheat sheet is up to date
        run: node claude-plugin/scripts/sync.ts --check

  roc:
    name: Roc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Roc
        run: sh .github/install-roc.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Generated code is up to date
        run: |
          python3 roc/scripts/gen_conformance.py
          python3 roc/scripts/gen_schema_conformance.py
          python3 roc/scripts/gen_json_conformance.py
          sh roc/examples/gen.sh
          git diff --exit-code
      - name: Test
        working-directory: roc
        run: |
          (cd package && roc test ConformanceTest.roc && roc test TimeTest.roc)
          (cd package && roc test Decode.roc && roc test Encode.roc && roc test Int.roc && roc test Streaming.roc && roc test Secret.roc && roc test Value.roc)
          (cd package && roc test JsonValue.roc && roc test FromJson.roc && roc test ToJson.roc)
          (cd examples/shop && roc test main.roc)
          (cd schema-test && roc test main.roc)
          (cd json-test && roc test main.roc)

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Lint and type check
        working-directory: python
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pyright
      - name: Test
        working-directory: python
        run: uv run pytest

  fuzz-build:
    name: Fuzzing / build the runners
    # The fuzz jobs run these binaries: the same image for all of them.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: spec/lean
          auto-config: false
          build: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            fuzz/schema-rust
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Install Roc
        run: sh .github/install-roc.sh
      - name: Build the parsers and checkers under test
        run: |
          (cd typescript && pnpm install --frozen-lockfile)
          sh fuzz/build.sh
      # Artifacts drop the executable bit, so the runners travel as a tarball.
      - name: Pack the runners
        run: |
          tar -czf fuzz-runners.tgz \
            spec/lean/.lake/build/bin/haus-ref \
            rust/target/release/examples/fuzz_runner rust/target/release/examples/time_runner \
            fuzz/schema-rust/target/release/schema_runner fuzz/schema-rust/target/release/json_runner fuzz/schema-rust/target/release/check_runner \
            fuzz/.build \
            typescript/packages/haus/dist typescript/packages/effect/dist
      - uses: actions/upload-artifact@v4
        with:
          name: fuzz-runners
          path: fuzz-runners.tgz
          retention-days: 1

  fuzz:
    name: Fuzzing / ${{ matrix.mode }}
    needs: fuzz-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Each mode runs on its own runner against the same binaries; `pr` and
        # `nightly` are the case counts (std/time cases are cheap, so many more;
        # 0: no count, the fuzzers' unit tests).
        include:
          - { mode: own-tests, run: "node --test fuzz/src/", pr: 0, nightly: 0 }
          - { mode: parser, run: "node fuzz/src/main.ts", pr: 100000, nightly: 1000000 }
          - { mode: canonical, run: "node fuzz/src/main.ts --canonical", pr: 100000, nightly: 1000000 }
          - { mode: time, run: "node fuzz/src/time.ts", pr: 2000000, nightly: 20000000 }
          - { mode: schema, run: "node fuzz/src/main.ts --schema", pr: 20000, nightly: 500000 }
          - { mode: json, run: "node fuzz/src/main.ts --json", pr: 4000, nightly: 50000 }
          - { mode: format, run: "node fuzz/src/main.ts --format", pr: 20000, nightly: 200000 }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - uses: actions/download-artifact@v4
        with:
          name: fuzz-runners
      - name: Unpack the runners
        run: |
          tar -xzf fuzz-runners.tgz
          (cd typescript && pnpm install --frozen-lockfile)
          (cd python && uv sync -q)
      - name: Fuzz
        run: |
          count=${{ github.event_name == 'schedule' && matrix.nightly || matrix.pr }}
          # A new seed every run, printed in the log; the same for every mode, as before.
          seed=$(( ${{ github.run_id }} % 1000000 ))
          if [ "$count" = 0 ]; then set -x; ${{ matrix.run }}; exit; fi
          set -x
          ${{ matrix.run }} --count "$count" --seed "$seed"
      - name: Keep the failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-${{ matrix.mode }}
          path: fuzz/.out/**/failures*
