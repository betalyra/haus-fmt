# Tests for every binding, the Lean proofs, and differential fuzzing.
#
# Pull requests and pushes to main run everything with a modest fuzzing
# budget; the nightly run fuzzes much longer. A fuzzing failure prints its
# seed: `node fuzz/src/main.ts --seed S` (or fuzz/src/time.ts, fuzz/src/profiles.ts) repeats it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Roc compiler is pre-release: pin the nightly the code is written for.
  ROC_NIGHTLY: nightly-2026-11-03-34bd006
  NODE_VERSION: "26"
  PNPM_VERSION: "12.4.1"

jobs:
  # Changes only to the website, docs, plans or top-level Markdown skip the
  # jobs below (a skipped job counts as passed for required checks); `docs`
  # still checks the generated documentation. Nightly and manual runs, and
  # anything else that changed, run everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      packages: ${{ steps.diff.outputs.packages }}
      tree_sitter: ${{ steps.diff.outputs.tree_sitter }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        run: |
          case "${{ github.event_name }}" in
            pull_request) range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"; base="${{ github.event.pull_request.base.sha }}" ;;
            push) range="${{ github.event.before }}..${{ github.sha }}"; base="${{ github.event.before }}" ;;
            *) printf 'code=true\npackages=true\ntree_sitter=true\n' >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # A new branch or a force push has no usable base: run everything.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then printf 'code=true\npackages=true\ntree_sitter=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$range")
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -qvE '^(website/|docs/|plans/|[^/]+\.md$|$)'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # Package resolution (file systems differ by OS): also run on Windows.
          if printf '%s\n' "$files" | grep -qE '^(test-suite/packages/|rust/haus-schema/|rust/haus-build/(src/(lib|graph|roc)\.rs|tests/package_suite\.rs)|typescript/packages/haus/(src/(node|schema-file)\.ts|test/(package-suite|node)\.test\.ts)|python/(src/haus/_(resolve|schema_file)\.py|tests/test_package)|go/schema/(files|locator|manifest|resolve|packages_test)|\.github/workflows/ci\.yml)'; then packages=true; else packages=false; fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          # The Tree-sitter grammars: their sources, and what they are checked against
          # (every haus file, the reference parser, the fuzzer's generator).
          if printf '%s\n' "$files" | grep -qE '^(editors/tree-sitter-haus/|spec/grammar\.ebnf|typescript/packages/haus/|fuzz/src/generate\.ts|\.github/workflows/ci\.yml)|\.(haus|pretty|compact|minimised|error)$'; then tree_sitter=true; else tree_sitter=false; fi
          echo "tree_sitter=$tree_sitter" >> "$GITHUB_OUTPUT"

  docs:
    name: Generated docs are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      # errors.ts reads spec/errors.haus with the built TypeScript package.
      - name: Build the TypeScript package
        working-directory: typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter ./packages/haus build
      - run: node spec/scripts/errors.ts --check
      - run: node claude-plugin/scripts/sync.ts --check

  lean:
    name: Lean proofs and reference parser
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: spec/lean
          auto-config: false
          build: true
          # A warning fails the build, so a proof left as `sorry` can't slip in.
          build-args: "--wfail"
      - name: Conformance suite
        working-directory: spec/lean
        run: .lake/build/bin/haus-ref --suite ../../test-suite
      - name: Schema suite
        working-directory: spec/lean
        run: .lake/build/bin/haus-ref --schema-suite ../../test-suite/schema schema-suite.json
      - name: JSON suite
        working-directory: spec/lean
        run: .lake/build/bin/haus-ref --json-suite ../../test-suite/json json-suite.json
      - name: Package suite
        working-directory: spec/lean
        run: .lake/build/bin/haus-ref --packages ../../test-suite/packages/cases.haus
      - name: Stream suite
        working-directory: spec/lean
        run: .lake/build/bin/haus-ref --stream-suite ../../test-suite/stream
      - name: Profile vectors
        working-directory: spec/lean
        run: |
          .lake/build/bin/haus-ref --profile @haus-fmt/money/iso ../../extensions/money/profiles/iso.vectors.haus
          .lake/build/bin/haus-ref --profile @haus-fmt/geo/wgs84 ../../extensions/geo/profiles/wgs84.vectors.haus

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        working-directory: rust
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        working-directory: rust
        run: cargo test --workspace --all-features

  typescript:
    name: TypeScript
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Install
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: typescript
        run: pnpm typecheck
      - name: Test
        working-directory: typescript
        run: pnpm test
      - name: Effect lint (@effect/tsgo)
        working-directory: typescript/packages/effect
        run: pnpm lint
      - name: Extensions lint (@effect/tsgo)
        working-directory: typescript
        run: pnpm --filter @haus-fmt/money --filter @haus-fmt/geo lint
      - name: Lean schema types are up to date
        run: |
          node spec/lean/scripts/schema-types.ts > spec/lean/schema-suite.json
          node spec/lean/scripts/schema-types.ts test-suite/json > spec/lean/json-suite.json
          git diff --exit-code spec/lean/schema-suite.json spec/lean/json-suite.json
      - name: The skill's cheat sheet is up to date
        run: node claude-plugin/scripts/sync.ts --check

  roc:
    name: Roc
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Roc
        run: sh .github/install-roc.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Generated code is up to date
        run: |
          python3 roc/scripts/gen_conformance.py
          python3 roc/scripts/gen_schema_conformance.py
          python3 roc/scripts/gen_json_conformance.py
          sh roc/examples/gen.sh
          git diff --exit-code
      - name: Test
        working-directory: roc
        run: |
          roc fmt --check package
          (cd package && roc test ConformanceTest.roc && roc test TimeTest.roc)
          (cd package && roc test Decode.roc && roc test Encode.roc && roc test Int.roc && roc test Streaming.roc && roc test StreamSuiteTest.roc && roc test Secret.roc && roc test Value.roc)
          (cd package && roc test JsonValue.roc && roc test FromJson.roc && roc test ToJson.roc)
          (cd examples/shop && roc test main.roc)
          (cd schema-test && roc test main.roc)
          (cd json-test && roc test main.roc)
          (cd closure-test && roc test main.roc)
          (cd profiles-test && roc test main.roc)

  python:
    name: Python
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Lint and type check
        working-directory: python
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pyright
      - name: Test
        working-directory: python
        run: uv run pytest
      # The official extensions' Python packages (haus-fmt-money, haus-fmt-geo).
      - name: Extensions, lint, type check and test
        run: |
          for dir in extensions/money/python extensions/geo/python; do
            (cd "$dir" && uv run ruff check . && uv run ruff format --check . && uv run mypy && uv run pyright && uv run pytest)
          done

  go:
    name: Go ${{ matrix.go }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version go.mod allows, and the newest.
        go: ["1.24.x", "1.27.x"]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.mod
      - name: Format and vet
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt-ed:"; echo "$unformatted"; exit 1; fi
          go vet ./...
      - name: Lint
        if: matrix.go == '1.27.x'
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      - name: Test
        run: go test ./...
      - name: Test with the race detector
        if: matrix.go == '1.27.x'
        run: go test -race ./...
      - name: Fuzz
        if: matrix.go == '1.27.x'
        run: |
          fuzztime=30s
          if [ "${{ github.event_name }}" = schedule ]; then fuzztime=10m; fi
          go test -run '^$' -fuzz '^FuzzParse$' -fuzztime "$fuzztime" .
          go test -run '^$' -fuzz '^FuzzStream$' -fuzztime "$fuzztime" .
          go test -run '^$' -fuzz '^FuzzFormatString$' -fuzztime "$fuzztime" .
          go test -run '^$' -fuzz '^FuzzSchemaParse$' -fuzztime "$fuzztime" ./schema
          go test -run '^$' -fuzz '^FuzzDecode$' -fuzztime "$fuzztime" ./schema
          go test -run '^$' -fuzz '^FuzzJSON$' -fuzztime "$fuzztime" .
          go test -run '^$' -fuzz '^FuzzSchemaJSON$' -fuzztime "$fuzztime" ./schema

  tree-sitter:
    name: Tree-sitter grammars
    needs: changes
    if: needs.changes.outputs.tree_sitter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      # The grammar package is in the pnpm workspace (typescript/), so this
      # also installs the tree-sitter CLI. scripts/check.mjs compares the
      # trees with the reference parser built here.
      - name: Install and build the TypeScript package
        working-directory: typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter ./packages/haus build
      # The grammar package's scripts run through the workspace in typescript/:
      # pnpm run inside editors/ would treat it as a project of its own and
      # refuse the CLI's install script.
      - name: Generated parsers are up to date
        working-directory: typescript
        run: |
          pnpm --filter tree-sitter-haus run generate
          git status --porcelain -- ../editors/tree-sitter-haus/haus/src ../editors/tree-sitter-haus/haus_schema/src
          test -z "$(git status --porcelain -- ../editors/tree-sitter-haus/haus/src ../editors/tree-sitter-haus/haus_schema/src)"
      # tree-sitter test in haus/ and haus_schema/, each with its test/corpus.
      - name: Corpus
        working-directory: typescript
        run: pnpm --filter tree-sitter-haus test
      # Uses node_modules/.bin/tree-sitter, which pnpm installed above.
      - name: Every haus file, against the reference parser
        working-directory: editors/tree-sitter-haus
        run: node scripts/check.mjs

  packages-windows:
    name: Package resolution on Windows
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # The suites are raw bytes: no line ending conversion.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.27.x"
      - name: TypeScript
        working-directory: typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter ./packages/haus build
          pnpm --filter ./packages/haus exec vitest run test/package-suite.test.ts test/node.test.ts
      - name: Rust
        # Run every language, even when one fails.
        if: success() || failure()
        working-directory: rust
        run: cargo test -p haus-fmt-schema
      - name: Rust and Roc generators
        # The package suite through haus-fmt-build and haus-gen roc.
        if: success() || failure()
        working-directory: rust
        run: cargo test -p haus-fmt-build --test package_suite
      - name: Python
        # Run every language, even when one fails.
        if: success() || failure()
        working-directory: python
        run: uv run pytest tests/test_package_suite.py tests/test_packages.py
      - name: Go
        # Run every language, even when one fails.
        if: success() || failure()
        working-directory: go
        # All of ./schema, the package suite (which makes symbolic links) included.
        run: go test ./schema

  packages-macos:
    name: Package resolution on macOS
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.27.x"
      - name: TypeScript
        working-directory: typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter ./packages/haus build
          pnpm --filter ./packages/haus exec vitest run test/package-suite.test.ts test/node.test.ts
      - name: Rust
        # Run every language, even when one fails.
        if: success() || failure()
        working-directory: rust
        run: cargo test -p haus-fmt-schema
      - name: Rust and Roc generators
        # The package suite through haus-fmt-build and haus-gen roc.
        if: success() || failure()
        working-directory: rust
        run: cargo test -p haus-fmt-build --test package_suite
      - name: Python
        # Run every language, even when one fails.
        if: success() || failure()
        working-directory: python
        run: uv run pytest tests/test_package_suite.py tests/test_packages.py
      - name: Go
        # Run every language, even when one fails.
        if: success() || failure()
        working-directory: go
        # All of ./schema, the package suite (which makes symbolic links) included.
        run: go test ./schema

  fuzz-build:
    name: Fuzzing / build the runners
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The fuzz jobs run these binaries: the same image for all of them.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: spec/lean
          auto-config: false
          build: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            fuzz/schema-rust
      - uses: astral-sh/setup-uv@v10.3.3
      # The Go runner (fuzz/go). The fuzz jobs only run it, a static binary, so they don't need Go.
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: fuzz/go/go.mod
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Install Roc
        run: sh .github/install-roc.sh
      - name: Build the parsers and checkers under test
        run: |
          (cd typescript && pnpm install --frozen-lockfile)
          sh fuzz/build.sh
      # Artifacts drop the executable bit, so the runners travel as a tarball.
      - name: Pack the runners
        run: |
          tar -czf fuzz-runners.tgz \
            spec/lean/.lake/build/bin/haus-ref \
            rust/target/release/examples/fuzz_runner rust/target/release/examples/time_runner \
            fuzz/schema-rust/target/release/schema_runner fuzz/schema-rust/target/release/json_runner fuzz/schema-rust/target/release/check_runner \
            fuzz/schema-rust/target/release/profile_runner fuzz/schema-rust/target/release/schema_check_runner \
            fuzz/.build \
            typescript/packages/haus/dist typescript/packages/effect/dist typescript/packages/import/dist \
            extensions/money/dist extensions/geo/dist
      - uses: actions/upload-artifact@v4
        with:
          name: fuzz-runners
          path: fuzz-runners.tgz
          retention-days: 1

  fuzz:
    name: Fuzzing / ${{ matrix.mode }}
    needs: fuzz-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Each mode runs on its own runner against the same binaries; `pr` and
        # `nightly` are the case counts (std/time cases are cheap, so many more;
        # 0: no count, the fuzzers' unit tests).
        include:
          - { mode: own-tests, run: "node --test fuzz/src/", pr: 0, nightly: 0 }
          - { mode: parser, run: "node fuzz/src/main.ts", pr: 100000, nightly: 1000000 }
          - { mode: canonical, run: "node fuzz/src/main.ts --canonical", pr: 100000, nightly: 1000000 }
          - { mode: time, run: "node fuzz/src/time.ts", pr: 2000000, nightly: 20000000 }
          # Cases for each official profile (iso, wgs84), through every binding's codecs.
          - { mode: profiles, run: "node fuzz/src/profiles.ts", pr: 200000, nightly: 2000000 }
          - { mode: schema, run: "node fuzz/src/main.ts --schema", pr: 20000, nightly: 500000 }
          - { mode: json, run: "node fuzz/src/main.ts --json", pr: 4000, nightly: 50000 }
          - { mode: format, run: "node fuzz/src/main.ts --format", pr: 20000, nightly: 200000 }
          # Schema files through every binding's schema-file checker (Roc has none of its own).
          - { mode: schema-check, run: "node fuzz/src/main.ts --schema-check", pr: 20000, nightly: 500000 }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - uses: actions/download-artifact@v4
        with:
          name: fuzz-runners
      - name: Unpack the runners
        run: |
          tar -xzf fuzz-runners.tgz
          (cd typescript && pnpm install --frozen-lockfile)
          (cd python && uv sync -q)
      - name: Fuzz
        run: |
          count=${{ github.event_name == 'schedule' && matrix.nightly || matrix.pr }}
          # A new seed every run, printed in the log; the same for every mode, as before.
          seed=$(( ${{ github.run_id }} % 1000000 ))
          if [ "$count" = 0 ]; then set -x; ${{ matrix.run }}; exit; fi
          set -x
          ${{ matrix.run }} --count "$count" --seed "$seed"
      - name: Keep the failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-${{ matrix.mode }}
          path: fuzz/.out/**/failures*
