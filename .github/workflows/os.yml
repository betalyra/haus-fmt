# Every binding's tests and conformance suites on Windows and macOS
# (ci.yml runs them on Linux, plus Swift on macOS). The parsers are pure, but
# stack sizes (Windows threads get 1 MB), default text encodings, line endings
# and clocks differ by OS. Nightly, on pushes to main, and on pull requests
# that change this file; not on every pull request, so those stay fast.
# Not here: the fuzzer, Lean and Roc (the reference and the niche binding),
# which run on Linux only.
name: All OS

on:
  push:
    branches: [main]
  pull_request:
    paths: [.github/workflows/os.yml]
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "12.4.1"

defaults:
  run:
    shell: bash

jobs:
  typescript:
    name: TypeScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      # The suites are raw bytes: no line ending conversion.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Install
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Build and test
        working-directory: typescript
        run: pnpm build && pnpm test

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test
        working-directory: rust
        run: cargo test --workspace --all-features

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Test
        working-directory: python
        run: uv run pytest
      - name: Extensions
        run: |
          for dir in extensions/money/python extensions/geo/python; do
            (cd "$dir" && uv run pytest)
          done

  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: go
    steps:
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: go/go.mod
      - name: Test
        run: go test ./...

  jvm:
    name: JVM (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: jvm
    steps:
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        run: ./gradlew build --no-daemon

  zig:
    name: Zig (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: zig
    steps:
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.1
      # The unit tests, the C ABI's tests and the conformance suite, in a safe
      # build mode, then the suite in debug (as ci.yml runs them on Linux).
      - name: Test
        run: zig build test -Doptimize=ReleaseSafe --summary all
      - name: Conformance suite (debug)
        run: zig build suite
      - name: Examples
        run: zig build examples --summary all
