[package]
name = "haus-fmt-build"
version.workspace = true
description = "Rust types from haus schemas, generated in build.rs"
readme = "../README.md"
keywords = ["haus", "codegen", "build-script", "schema"]
categories = ["development-tools::build-utils", "encoding"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# Published as haus-fmt-build, imported as haus_build.
[lib]
name = "haus_build"

[dependencies]
haus = { package = "haus-fmt", path = "../haus", version = "0.2.0" }
haus-schema = { package = "haus-fmt-schema", path = "../haus-schema", version = "0.2.0" }
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.10", default-features = false, features = ["full", "parsing", "printing"] }

[dev-dependencies]
tempfile = "3.27.0"

# Not released as binaries by dist (dist-workspace.toml): only the command line is.
[package.metadata.dist]
dist = false
