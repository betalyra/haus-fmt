[package]
# Published as haus-fmt-cli (the name haus is taken on crates.io); the command is `haus`.
name = "haus-fmt-cli"
version = "0.1.0"
description = "The haus command line: check data against schemas, format, canonical form and hashes"
readme = "README.md"
keywords = ["haus", "cli", "formatter", "validation", "data-format"]
categories = ["command-line-utilities", "encoding", "parser-implementations"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "haus"
path = "src/main.rs"

[dependencies]
haus = { package = "haus-fmt", path = "../haus", version = "0.1.0", features = ["hash"] }
haus-schema = { package = "haus-fmt-schema", path = "../haus-schema", version = "0.1.0" }
annotate-snippets = "0.12.18"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
ignore = "0.4.34"
toml = { version = "1.1.8", default-features = false, features = ["std", "parse"] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
predicates = "3.1.4"
tempfile = "3.27.0"
