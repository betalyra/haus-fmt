# A fixture of `haus package check`, read as a file: not built.
[project]
name = "fixture-good"
version = "1.0.0"
dependencies = ["haus-fmt>=0.1", "fixture-base>=1.2,<2"]

[tool.uv.sources]
fixture-base = { path = "../base" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fixture_good"]

[tool.hatch.build.targets.wheel.force-include]
"package.haus" = "fixture_good/package.haus"
"schema.haus" = "fixture_good/schema.haus"
"profiles" = "fixture_good/profiles"
