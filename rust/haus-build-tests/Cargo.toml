[package]
name = "haus-build-tests"
version = "0.0.0"
description = "Tests of the code haus-fmt-build generates (it needs a build script, so it is a crate of its own)"
edition.workspace = true
publish = false

[dependencies]
haus = { package = "haus-fmt", path = "../haus" }
# Schema packages (packages/): shop.schema.haus imports orders and money.
haus-test-money = { path = "packages/money" }
haus-test-orders = { path = "packages/orders" }
# The official packages and their profiles' codecs (travel.schema.haus, tests/profiles.rs).
haus-fmt-money = { path = "../../extensions/money" }
haus-fmt-geo = { path = "../../extensions/geo" }
haus-test-travel = { path = "packages/travel" }

[dev-dependencies]
haus-fmt-build = { path = "../haus-build" }

[build-dependencies]
haus-fmt-build = { path = "../haus-build" }
