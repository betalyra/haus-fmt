[project]
name = "haus-fmt-uuid"
version = "1.0.0"
description = "@haus-fmt/uuid: universally unique identifiers (a haus schema package), with the codecs of its profile rfc9562"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["haus", "schema", "uuid", "rfc9562"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = ["haus-fmt>=0.1"]

[project.urls]
Homepage = "https://haus-fmt.org"
Repository = "https://github.com/betalyra/haus-fmt"

# Installed as `haus-fmt-uuid`, imported as `haus_uuid`. The schema package's files (one
# directory up: package.haus, schema.haus, profiles/) are copied into the module by
# hatch_build.py, so the wheel carries the same files as the npm package and the crate.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haus_uuid"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "hatch_build.py", "README.md"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv.sources]
haus-fmt = { path = "../../../python", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "pyright>=1.1.400", "mypy>=1.18"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
