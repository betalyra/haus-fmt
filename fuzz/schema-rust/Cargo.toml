[package]
name = "haus-schema-fuzz"
version = "0.0.0"
description = "The Rust runners of the schema, schema-file, JSON and profile fuzzers (fuzz/README.md): the code haus-fmt-build generates, haus-fmt-schema's runtime checker and schema-file checker, and the official profiles' codecs"
edition = "2024"
publish = false

# Not part of the rust/ workspace: a crate of its own, built by fuzz/build.sh.
[workspace]

[[bin]]
name = "schema_runner"
path = "src/main.rs"

[[bin]]
name = "json_runner"
path = "src/json_runner.rs"

[[bin]]
name = "check_runner"
path = "src/check_runner.rs"

[[bin]]
name = "profile_runner"
path = "src/profile_runner.rs"

[[bin]]
name = "schema_check_runner"
path = "src/schema_check_runner.rs"

[dependencies]
haus = { package = "haus-fmt", path = "../../rust/haus" }
haus-schema = { package = "haus-fmt-schema", path = "../../rust/haus-schema" }
# The official packages, with their profiles' codecs (profile_runner).
haus-fmt-money = { path = "../../extensions/money" }
haus-fmt-geo = { path = "../../extensions/geo" }

[build-dependencies]
haus-fmt-build = { path = "../../rust/haus-build" }

[profile.release]
debug = 1
